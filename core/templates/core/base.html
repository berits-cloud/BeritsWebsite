{% load static %}<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Berit Andres — ruhiges, durchdachtes Webdesign für kleine Unternehmen und Kreative.{% endblock %}">
    <title>{% block title %}Berit Andres — Webdesign{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="page-{% block body_class %}default{% endblock %}">

<header class="site-header" id="siteHeader">
    <div class="container nav-wrap">
        <a href="{% url 'core:home' %}" class="brand">
            <span class="nav-logo">Berit <em>Andres</em></span>
        </a>

        <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menü öffnen">
        <label for="nav-toggle" class="nav-burger" aria-hidden="true">
            <span></span><span></span><span></span>
        </label>

        <nav class="site-nav" aria-label="Hauptnavigation">
            <a href="{% url 'core:home' %}">Start</a>
            <a href="{% url 'core:leistungen' %}">Leistungen</a>
            <a href="{% url 'core:portfolio' %}">Portfolio</a>
            <a href="{% url 'core:ueber' %}">Über mich</a>
            <a href="{% url 'core:kontakt' %}" class="nav-cta">Kontakt</a>
        </nav>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <div class="container footer-bar">
        <small>© {% now "Y" %} Berit Andres Studio</small>
        <nav class="footer-legal" aria-label="Rechtliches">
            <a href="{% url 'core:impressum' %}">Impressum</a>
            <a href="{% url 'core:datenschutz' %}">Datenschutz</a>
        </nav>
        <small>Gestaltet mit Liebe zum Detail</small>
    </div>
</footer>

<script>
    // Header bekommt beim Scrollen einen festen Hintergrund (cremefarben + dunkle Schrift)
    (function () {
        var header = document.getElementById('siteHeader');
        if (!header) return;
        var onScroll = function () {
            if (window.scrollY > 40) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        };
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
    })();

    // Handy: Leistungs-Karten leuchten beim Scrollen nacheinander auf
    (function () {
        var cards = document.querySelectorAll('.cards .card');
        if (!cards.length || !('IntersectionObserver' in window)) return;
        var mq = window.matchMedia('(max-width: 900px)');
        var observer = null;

        function activate() {
            if (observer) return;
            observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) entry.target.classList.add('is-active');
                    else entry.target.classList.remove('is-active');
                });
            }, { rootMargin: '-45% 0px -45% 0px' }); // schmales Band in der Bildschirmmitte
            cards.forEach(function (card) { observer.observe(card); });
        }

        function deactivate() {
            if (!observer) return;
            observer.disconnect();
            observer = null;
            cards.forEach(function (card) { card.classList.remove('is-active'); });
        }

        function sync() { mq.matches ? activate() : deactivate(); }
        sync();
        mq.addEventListener('change', sync);
    })();

    // Fade-up: Elemente blenden sanft ein, sobald sie in den Viewport scrollen
    (function () {
        var els = document.querySelectorAll('.fade-up, .fade-up-stagger');
        if (!els.length) return;

        // Kein Observer / reduzierte Bewegung → einfach alles sofort zeigen
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!('IntersectionObserver' in window) || reduce) {
            els.forEach(function (el) { el.classList.add('is-visible'); });
            return;
        }

        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (!entry.isIntersecting) return;
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target); // nur einmal einblenden
            });
        }, { rootMargin: '0px 0px -10% 0px', threshold: 0.1 });

        els.forEach(function (el) { observer.observe(el); });
    })();

</script>

</body>
</html>
